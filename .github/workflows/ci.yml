name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew :app:assembleDebug :app:lintDebug

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew :shared:jvmTest :desktop:packageAppImage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hev-x86_64.AppImage
          path: desktop/build/appimage/hev-*-x86_64.AppImage
          if-no-files-found: error
