name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew :shared:jvmTest :desktop:packageAppImage
      - name: Draft the release
        working-directory: desktop/build/appimage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          appimage="hev-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          sha256sum "$appimage" > "$appimage.sha256"
          gh release create "$GITHUB_REF_NAME" "$appimage" "$appimage.sha256" \
            --draft --verify-tag --generate-notes --title "HEV ${GITHUB_REF_NAME#v}"
